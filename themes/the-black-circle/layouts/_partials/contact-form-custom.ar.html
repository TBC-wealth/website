<form class="tbc-form" id="lead-form" method="post" action="" novalidate>
  <div class="form-row">
    <div class="form-field">
      <label for="cf-name">الاسم الكامل</label>
      <input type="text" id="cf-name" name="name" autocomplete="name" placeholder="الاسم الكامل" required aria-required="true" aria-invalid="false" aria-describedby="cf-name-err">
      <p class="form-error" id="cf-name-err" role="alert" hidden></p>
    </div>
    <div class="form-field">
      <label for="cf-email">البريد الإلكتروني</label>
      <input type="email" id="cf-email" name="email" autocomplete="email" placeholder="you@example.com" required aria-required="true" aria-invalid="false" aria-describedby="cf-email-err">
      <p class="form-error" id="cf-email-err" role="alert" hidden></p>
    </div>
  </div>
  <div class="form-row">
    <div class="form-field">
      <label for="cf-phone">الهاتف <span class="opt">(اختياري)</span></label>
      <input type="tel" id="cf-phone" name="phone" autocomplete="tel" placeholder="+1 555 000 0000" aria-invalid="false">
    </div>
    <div class="form-field">
      <label for="cf-company">الشركة / المؤسسة <span class="opt">(اختياري)</span></label>
      <input type="text" id="cf-company" name="company" autocomplete="organization" placeholder="اسم الشركة">
    </div>
  </div>
  <div class="form-field">
    <label for="cf-message">وصف موجز لمتطلباتك</label>
    <textarea id="cf-message" name="message" rows="4" placeholder="أخبرنا باختصار كيف يمكننا المساعدة" required aria-required="true" aria-invalid="false" aria-describedby="cf-message-err"></textarea>
    <p class="form-error" id="cf-message-err" role="alert" hidden></p>
  </div>
  <label class="form-check"><input type="checkbox" name="eligible" value="yes" required> أؤكد أنني مستثمر مهني أو مؤسسي أو متطور.</label>
  <label class="form-check"><input type="checkbox" name="marketing" value="yes"> أوافق على تلقي تحديثات دورية من The Black Circle. يمكنني إلغاء الاشتراك في أي وقت.</label>
  <p class="form-notice">نستخدم هذه التفاصيل للرد على استفسارك وتقييم الأهلية. اطّلع على <a href="{{ "/privacy-policy/" | relLangURL }}">سياسة الخصوصية</a>. لا يُعد إرسال هذا النموذج تأكيدًا للأهلية.</p>
  <button type="submit" class="btn btn--primary">إرسال الطلب <span class="arrow">&rsaquo;</span></button>
  <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
</form>
<script>
(function(){
  var form=document.getElementById('lead-form');if(!form)return;
  var status=document.getElementById('form-status');
  function setError(field,msg){
    var err=document.getElementById(field.getAttribute('aria-describedby'));
    field.setAttribute('aria-invalid',msg?'true':'false');
    if(err){if(msg){err.textContent=msg;err.hidden=false;}else{err.textContent='';err.hidden=true;}}
  }
  function validate(){
    var firstInvalid=null;
    ['cf-name','cf-email','cf-message'].forEach(function(id){
      var f=document.getElementById(id);var val=(f.value||'').trim();
      var msg='';
      if(f.required&&!val){msg='هذا الحقل مطلوب.';}
      else if(f.type==='email'&&val&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)){msg='يرجى إدخال بريد إلكتروني صحيح.';}
      setError(f,msg);
      if(msg&&!firstInvalid){firstInvalid=f;}
    });
    var elig=form.querySelector('input[name="eligible"]');
    if(!elig.checked){
      setError(elig,'يرجى تأكيد وضعك كمستثمر للمتابعة.');
      if(!firstInvalid){firstInvalid=elig;}
    }else{setError(elig,'');}
    if(firstInvalid){firstInvalid.focus();}
    return !firstInvalid;
  }
  form.addEventListener('submit',function(e){
    e.preventDefault();
    status.textContent='';
    if(!validate()){status.textContent='يرجى مراجعة الحقول المميزة.';status.style.color='#B3261E';return;}
    status.style.color='';
    status.textContent='جاري الإرسال...';
    var data={};new FormData(form).forEach(function(v,k){data[k]=v;});
    var subject=encodeURIComponent('طلب جديد: '+(data.name||'استفسار من الموقع'));
    var body=encodeURIComponent(
      'الاسم: '+(data.name||'')+'\n'+
      'البريد الإلكتروني: '+(data.email||'')+'\n'+
      'الهاتف: '+(data.phone||'')+'\n'+
      'الشركة: '+(data.company||'')+'\n'+
      'الرسالة: '+(data.message||'')+'\n'+
      'تأكيد الأهلية: '+(data.eligible?'نعم':'لا')+'\n'+
      'موافقة التسويق: '+(data.marketing?'نعم':'لا')+'\n'+
      'المصدر: theblackcircle.com'
    );
    window.location.href='mailto:info@theblackcircle.com?subject='+subject+'&body='+body;
    status.textContent='جاري فتح برنامج البريد الإلكتروني... إذا لم يحدث شيء، يرجى مراسلة info@theblackcircle.com مباشرة.';
    setTimeout(function(){status.textContent='شكراً لك. يجب أن يكون قد فُتح برنامج بريدك الإلكتروني بطلبك مُعبأً مسبقاً. يرجى إرساله لإتمام تقديمك.';},2000);
  });
  ['cf-name','cf-email','cf-message'].forEach(function(id){
    var f=document.getElementById(id);
    if(f){f.addEventListener('input',function(){setError(f,'');});}
  });
  var elig=form.querySelector('input[name="eligible"]');
  if(elig){elig.addEventListener('change',function(){setError(elig,'');});}
})();
</script>

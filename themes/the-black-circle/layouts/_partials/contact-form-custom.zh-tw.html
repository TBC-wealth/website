<form class="tbc-form" id="lead-form">
  <div class="form-row">
    <input type="text" name="name" placeholder="全名" required>
    <input type="email" name="email" placeholder="電子郵件" required>
  </div>
  <div class="form-row">
    <input type="text" name="phone" placeholder="電話（可選）">
    <input type="text" name="company" placeholder="公司 / 機構（可選）">
  </div>
  <textarea name="message" rows="4" placeholder="簡述您的需求" required></textarea>
  <label class="form-check"><input type="checkbox" name="eligible" required> 我確認我是專業、機構或具經驗的投資者。</label>
  <button type="submit" class="btn btn--primary">提交請求 <span class="arrow">&rsaquo;</span></button>
  <p class="form-status" id="form-status"></p>
</form>
<script>
(function(){
  var form=document.getElementById('lead-form');if(!form)return;
  var status=document.getElementById('form-status');
  form.addEventListener('submit',function(e){
    e.preventDefault();
    status.textContent='提交中...';
    var data={};new FormData(form).forEach(function(v,k){data[k]=v;});
    var subject=encodeURIComponent('新查詢: '+(data.name||'網站查詢'));
    var body=encodeURIComponent(
      '姓名: '+(data.name||'')+'\n'+
      '電郵: '+(data.email||'')+'\n'+
      '電話: '+(data.phone||'')+'\n'+
      '公司: '+(data.company||'')+'\n'+
      '訊息: '+(data.message||'')+'\n'+
      '資格確認: '+(data.eligible?'是':'否')+'\n'+
      '來源: theblackcircle.com'
    );
    window.location.href='mailto:info@theblackcircle.com?cc=alberto@theblackcircle.com&subject='+subject+'&body='+body;
    status.textContent='正在開啟電郵應用程式...';
    setTimeout(function(){status.textContent='感謝您。您的電郵應用程式應已開啟並預填了您的請求。請發送以完成提交。';},2000);
  });
})();
</script>

<form class="tbc-form" id="lead-form">
  <div class="form-row">
    <input type="text" name="name" placeholder="Full name" required>
    <input type="email" name="email" placeholder="Email address" required>
  </div>
  <div class="form-row">
    <input type="text" name="phone" placeholder="Phone (optional)">
    <input type="text" name="company" placeholder="Company / Organization (optional)">
  </div>
  <textarea name="message" rows="4" placeholder="Brief description of your requirements" required></textarea>
  <label class="form-check"><input type="checkbox" name="eligible" required> I confirm I am a professional, institutional, or sophisticated investor.</label>
  <button type="submit" class="btn btn--primary">Submit request <span class="arrow">&rsaquo;</span></button>
  <p class="form-status" id="form-status"></p>
</form>
<script>
(function(){
  var form=document.getElementById('lead-form');if(!form)return;
  var status=document.getElementById('form-status');
  form.addEventListener('submit',function(e){
    e.preventDefault();
    status.textContent='Submitting...';
    var data={};new FormData(form).forEach(function(v,k){data[k]=v;});
    var subject=encodeURIComponent('New Lead: '+(data.name||'Website Enquiry'));
    var body=encodeURIComponent(
      'Name: '+(data.name||'')+'\n'+
      'Email: '+(data.email||'')+'\n'+
      'Phone: '+(data.phone||'')+'\n'+
      'Company: '+(data.company||'')+'\n'+
      'Message: '+(data.message||'')+'\n'+
      'Eligibility confirmed: '+(data.eligible?'Yes':'No')+'\n'+
      'Source: theblackcircle.com'
    );
    window.location.href='mailto:info@theblackcircle.com?cc=alberto@theblackcircle.com&subject='+subject+'&body='+body;
    status.textContent='Opening your email client... If nothing happens, please email info@theblackcircle.com directly.';
    setTimeout(function(){status.textContent='Thank you. Your email client should have opened with your request pre-filled. Please send it to complete your submission.';},2000);
  });
})();
</script>
